name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  security:
    # Separate job from `test`: ruff's own rule selection (pyproject.toml)
    # deliberately excludes bandit-style rules since bridge.py's few
    # except-pass blocks are reviewed and accepted (see the # nosec comments
    # inline) — this job runs bandit for real instead of just trusting that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r bridge.py
